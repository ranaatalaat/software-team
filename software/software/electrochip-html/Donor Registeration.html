<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <title>Responsive Registration Form | CodingLab</title>
  <link rel="stylesheet"
    href="C:\fatouh\guc\sem 6\Software Engineering\pr\software\__MACOSX\software\electrochip-html\css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    #map {
      height: 300px;
      /* Set the height of the map container */
      width: 100%;
      /* Make the map container full-width */
      margin-bottom: 20px;
      /* Add some margin at the bottom */
    }

    .button-container {
      display: flex;
      /* Use flexbox layout */
    }

    .button-container .button {
      background: #4C489D;
      border: none;
      color: #fff;
      box-shadow: 0px 2px 2px #5C5696;
      font-size: 18px;
      border-radius: 5px;
      padding: 12px 24px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-right: 30px;
      /* Add some spacing between buttons */
    }

    .button-container .button:hover {
      background: #6A679E;
    }


    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background: linear-gradient(135deg, #D4F1F4, #D4F1F4);

    }

    h2 {
      font-weight: normal;
      /* Set font weight to normal */
    }

    h3 {
      font-weight: normal;
      /* Set font weight to normal */
    }


    .container {
      max-width: 700px;
      width: 100%;
      background-color: #fff;
      padding: 25px 30px;
      border-radius: 5px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
      text-align: center;
      /* Center the logo */
      margin-top: 600px;
      /* Adjust top margin to shift down */
    }

    .container .logo {
      width: 150px;
      /* Adjust width as needed */
      margin-bottom: 5px;
      /* Add some spacing below the image */
    }

    .container .title {
      font-size: 25px;
      font-weight: 500;
      margin-bottom: 25px;
      position: relative;

    }

    .container .title::before {
      content: "";
      position: absolute;
      left: 285px;
      bottom: -10px;
      height: 3px;
      width: 70px;
      border-radius: 5px;
      background: linear-gradient(135deg, #05445E, #189AB4);

    }

    .user-details {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .input-box {
      margin-bottom: 20px;
      width: 100%;
    }

    .input-box span.details {
      display: block;
      font-weight: 500;
      margin-bottom: 5px;
    }

    .input-box input[type="text"],
    .input-box select {
      height: 45px;
      width: calc(100% - 20px);
      outline: none;
      font-size: 16px;
      border-radius: 5px;
      padding-left: 15px;
      border: 1px solid #ccc;
      border-bottom-width: 2px;
      transition: all 0.3s ease;
    }

    .input-box input[type="file"] {
      display: none;
    }

    .input-box label {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      height: 45px;
      width: calc(100% - 20px);
      border-radius: 5px;
      padding-left: 15px;
      border: 1px solid #ccc;
      border-bottom-width: 2px;
      transition: all 0.3s ease;
    }

    .button {
      margin-top: 20px;
      text-decoration: none;
    }

    .button input[type="submit"] {
      background: #4C489D;
      border: none;
      color: #fff;
      box-shadow: 0px 2px 2px #5C5696;
      font-size: 18px;
      border-radius: 5px;
      padding: 12px 24px;
      cursor: pointer;
      transition: background 0.3s ease;
    }


    .button input[type="submit"]:hover {
      background: #6A679E;
    }

    .button1 {
      display: inline-block;
      background-color: transparent;
      border: 1px solid #5C5696;
      color: #4C489D;
      box-shadow: 0px 2px 2px #5C5696;
      padding: 12px 20px;
      border-radius: 26px;
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 20px;
      text-decoration: none;
      /* Remove default link underline */
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .button1:hover {
      background-color: #007bff;
      color: #fff;
    }

    /* Remaining styles remain unchanged */
  </style>
</head>

<body>
  <div class="container">
    <img src="https://i.postimg.cc/5Nj4dHD2/Helping-hands.png" alt="Logo" class="logo">
    <div class="title">Registration</div>
    <div class="content">
      <form>
        <div class="user-details">
          <div class="input-box">
            <span class="details">First Name</span>
            <input type="text" placeholder="Enter your first name" required>
          </div>
          <div class="input-box">
            <span class="details">Last Name</span>
            <input type="text" placeholder="Enter your Last name" required>
          </div>
          <div class="input-box">
            <span class="details">Gender</span>
            <select required>
              <option value="">Select gender type</option>
              <option value="female">Female</option>
              <option value="Male">Male</option>
              <!-- Add more options as needed -->
            </select>
          </div>
          <div class="input-box">
            <span class="details">Email</span>
            <input type="text" placeholder="Enter your email" required>
          </div>
          <div class="input-box">
            <span class="details">Contact Number</span>
            <input type="text" placeholder="Enter your number" required>
          </div>
          <div class="input-box">
            <span class="details">Password</span>
            <input type="text" placeholder="Enter your password" required>
          </div>
          <div class="input-box">
            <span class="details">Address</span>
            <input type="text" placeholder="Enter your address" required>
          </div>
          <div class="input-box">
            <span class="details">Area</span>
            <input type="text" placeholder="Enter your area" required>
          </div>
          <div class="input-box">
            <span class="details">Governorate</span>
            <input type="text" placeholder="Enter your Governorate" required>
          </div>

          <h3>Donor Type</h3>





          <div class="button-container">
            <a href="login.html" class="button" id="volbutton">Volunteer</a>
            <a href="TeacherRegistration.html" class="button" id="tbutton">Teacher</a>
            <a href="DoctorRegistration.html" class="button" id="dbutton">Doctor</a>
          </div>



        </div>

        <a href="index.html" class="button1" id="backButton">Home</a>


      </form>
    </div>
  </div>

  <script>
    // Add event listener to the button
    document.getElementById("volbutton").onclick = function () {
      // Redirect to admin dashboard page
      window.location.href = "login.html";
    };

  </script>
</body>

</html>
